<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#9ca3af" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <!-- header -->
  <text x="40" y="44" font-family="monospace" font-size="22" font-weight="700" fill="#ff6d0a">AB</text>
  <rect x="100" y="30" width="70" height="10" rx="5" fill="#1f2937" opacity="0.7"/>
  <rect x="190" y="30" width="70" height="10" rx="5" fill="#1f2937" opacity="0.7"/>
  <circle cx="712" cy="36" r="9" fill="none" stroke="#ff6d0a" stroke-width="3"/>
  <circle cx="746" cy="36" r="10" fill="#f0f0f0" stroke="#0052b4" stroke-width="3"/>
  <!-- avatar -->
  <circle cx="400" cy="160" r="64" fill="#fdba74" stroke="#fed7aa" stroke-width="8"/>
  <circle cx="400" cy="145" r="22" fill="#fff7ed"/>
  <path d="M356 205c10-26 30-36 44-36s34 10 44 36" fill="#fff7ed"/>
  <circle cx="452" cy="212" r="13" fill="#fb923c" stroke="#ffffff" stroke-width="5"/>
  <circle cx="452" cy="108" r="13" fill="#ffffff" stroke="#fb923c" stroke-width="5"/>
  <circle cx="372" cy="94" r="4" fill="#f97316"/>
  <!-- title -->
  <rect x="230" y="262" width="340" height="34" rx="8" fill="url(#title)"/>
  <rect x="270" y="312" width="260" height="12" rx="6" fill="#6b7280" opacity="0.6"/>
  <!-- button -->
  <rect x="330" y="350" width="140" height="36" rx="6" fill="#ea580c"/>
  <rect x="356" y="364" width="88" height="8" rx="4" fill="#ffffff"/>
  <!-- chevron -->
  <path d="M384 420l16 16 16-16" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- footer -->
  <rect y="470" width="800" height="30" fill="#f66d0a"/>
</svg>
